# ===========================================================================
#  上游同步：检查 linguo2625469/workbuddy2api-panel 是否有新提交，有则合并进来
#
#  设计要点（每条都对应一个真实的坑）：
#
#  1. **用 merge 而不是 rebase / reset**。
#     本 fork 有自己的提交（根路径直达面板 server.panel_root、CORS 预检），
#     rebase 会重写这些提交的 hash，reset 则会直接从历史里丢掉它们。
#     merge 是唯一能既跟上上游、又保住 fork 改动的做法。
#     （注：单文件 bind mount 的配置写入兜底已归还上游 —— 上游 5e1422c + ab9a162
#     自行实现了同一语义，fork 侧实现已删除，故不再列为本 fork 的改动。）
#
#  2. **冲突时不推送、不猜**。`git merge` 失败即 `git merge --abort` 回到干净
#     状态并以非零码退出，让人来解。自动解冲突会把两边的语义混在一起，
#     而这个项目里 main.go / handler.go / config.go 是 fork 与上游都会碰的文件。
#     **但"没冲突"不等于"能编译"** —— 合并成功后还有一道编译闸门（见第 6 点）。
#
#  3. **推送后用 workflow_dispatch 显式拉起构建**。
#     GITHUB_TOKEN 触发的 push 事件不会触发其它 workflow（GitHub 的防递归设计，
#     workflow_dispatch 与 repository_dispatch 是官方例外）—— 所以推完 main
#     不显式 dispatch 的话，build-armv7 根本不会跑，镜像不会更新。
#     若配置了 secrets.SYNC_PAT（PAT 推送**会**触发后续 workflow），则跳过 dispatch
#     以免重复构建。
#
#  4. **本工作流只监听 schedule / workflow_dispatch**，不监听 push —— 从根上
#     杜绝「同步 → push → 再同步」的循环。
#
#  5. **触发构建时必须用 GH_REPO 钉死仓库**。gh 靠 git remote 推断"当前仓库"，
#     而它的优先顺序是 upstream(3) > github(2) > origin(1)；本工作流为了合并上游
#     刚好 `git remote add upstream ...`，于是 gh 会优先选中 upstream，把仓库解析成
#     linguo2625469/workbuddy2api-panel → 那里没有 build-armv7.yml →
#     `HTTP 404: workflow build-armv7.yml not found on the default branch`。
#     （2026-09-29、2026-10-05 两次失败同因，且重试 5 次必然全失败。）
#     GH_REPO 在 gh 的仓库解析里优先级最高，直接绕过 remote 推断。
#
#  6. **推送前必须过编译闸门**。git 的自动合并只看文本：上游与 fork「各加一段」
#     不算冲突，但结果可能是语义重复。2026-10-05 就这样把编译不过的代码推上了
#     main（Config 里出现两个 Server struct：fork 的 panel_root 撞上游的 read_timeout）
#     —— 而 build-armv7 又因第 5 点没被触发，于是没人发现，镜像整整 4 天没更新。
#     现在 `go build ./...` 失败即中止、不推送。
#
#  可选配置：
#     secrets.SYNC_PAT —— 一个 fine-grained PAT（contents: read/write, actions: write）。
#     不配也能跑，只是多一次显式 dispatch 调用。
# ===========================================================================

name: sync-upstream

on:
  schedule:
    # 每 2 天 00:16 检查一次上游更新
    - cron: '16 0 */2 * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: '即使上游无更新，也重新构建一次'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM_REPO: linguo2625469/workbuddy2api-panel
  UPSTREAM_BRANCH: main

jobs:
  sync:
    name: 检查并合并上游更新
    runs-on: ubuntu-latest
    steps:
      - name: 检出 fork 的 main（完整历史）
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          # 配了 SYNC_PAT 就用它（推送能触发后续 workflow）；否则退回 GITHUB_TOKEN
          token: ${{ secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}

      - name: 判断是否走的 PAT
        id: tok
        env:
          # 经 env 传入，避免直接把密钥插值进脚本正文
          SYNC_PAT: ${{ secrets.SYNC_PAT }}
        run: |
          if [ -n "$SYNC_PAT" ]; then
            echo "pat=true" >> "$GITHUB_OUTPUT"
          else
            echo "pat=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 配置 git 身份
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 拉取上游
        id: fetch
        run: |
          set -euo pipefail
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git" 2>/dev/null \
            || git remote set-url upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch --no-tags upstream "${UPSTREAM_BRANCH}"
          UPSTREAM_SHA=$(git rev-parse --short "upstream/${UPSTREAM_BRANCH}")
          echo "upstream_sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"
          echo "上游 ${UPSTREAM_BRANCH} 当前为 ${UPSTREAM_SHA}"

      - name: 比较差异
        id: diff
        run: |
          set -euo pipefail
          BEHIND=$(git rev-list --count HEAD..upstream/${UPSTREAM_BRANCH})
          AHEAD=$(git rev-list --count upstream/${UPSTREAM_BRANCH}..HEAD)
          echo "behind=$BEHIND" >> "$GITHUB_OUTPUT"
          echo "ahead=$AHEAD"   >> "$GITHUB_OUTPUT"
          echo "落后上游 $BEHIND 个提交；fork 自有提交 $AHEAD 个"
          if [ "$BEHIND" != "0" ]; then
            echo "--- 待合并的上游提交 ---"
            git log --oneline HEAD..upstream/${UPSTREAM_BRANCH} | head -30
          fi

      - name: 合并上游
        id: merge
        if: steps.diff.outputs.behind != '0'
        run: |
          set -euo pipefail
          echo "merged=true" >> "$GITHUB_OUTPUT"
          if git merge --no-edit "upstream/${UPSTREAM_BRANCH}"; then
            echo "合并成功：$(git rev-parse --short HEAD)"
          else
            echo "::error::上游更新与 fork 自有改动冲突，已回滚，未做任何推送。"
            # 冲突文件清单要在 abort 之前取，abort 之后工作区就干净了
            CONFLICTS=$(git diff --name-only --diff-filter=U | tr '\n' ' ')
            git merge --abort || true
            {
              echo "### ❌ 上游同步冲突，需要人工处理"
              echo
              echo "上游 \`${UPSTREAM_REPO}\` 的新提交与 fork 改动冲突，工作流已中止，**没有推送任何东西**。"
              echo
              if [ -n "${CONFLICTS}" ]; then
                echo "**冲突文件**：\`${CONFLICTS}\`"
                echo
                echo "> 提示：fork 改动已外置到 \`internal/server/fork_fixes.go\`"
                echo "> （该文件上游从不触碰，永不会冲突）。上游文件里只剩**最小接缝**："
                echo "> \`Config.PanelRoot\` 字段、\`ServeHTTP\` 首行、\`NewHandler\` 的 \`PanelRoot:\` 一行、"
                echo "> \`cmd/server/config.go\` 的 \`panel_root\` 字段。若仍冲突，多半是上游在"
                echo "> **紧邻这些接缝**的位置增删代码 —— 通常两边都保留即可（字段都留、调用都留）。"
                echo
                echo "> **另一种可能**：上游自己实现了 fork 的某项改动（提交标题会与"
                echo "> fork 改动高度重合）。此时应**引用上游、删掉 fork 版**，而不是硬解冲突。"
                echo "> 详见仓库根目录 \`FORK.md\` 的「改动归还」章节。"
                echo
              fi
              echo "**在本地解开**："
              echo
              echo '```bash'
              echo "git remote add upstream https://github.com/${UPSTREAM_REPO}.git  # 已加过可跳过"
              echo "git fetch upstream main"
              echo "git merge upstream/main     # 解冲突后 commit"
              echo "go build ./... && go test ./..."
              echo "CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build ./cmd/server/  # 验 armv7 未被破坏"
              echo "git push origin main"
              echo '```'
              echo
              echo "推完后到 Actions 页手动 Run \`build-armv7\`（或用带 \`workflow\` 权限的 PAT 推，会自动触发）。"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: 准备 Go（供编译闸门使用）
        if: steps.merge.outputs.merged == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      # git 的自动合并只看文本：两边「各加一段」不冲突，但结果可能是
      # **语义重复**（最典型：上游与 fork 各自往 Config 里加了一个 `Server struct`，
      # 于是 Config 出现两个同名字段 → Server redeclared）。2026-10-05 的自动合并
      # 就是这么把编译不过的代码推上 main 的（fork 的 panel_root 撞上游的 read_timeout）。
      # 因此合并不冲突 ≠ 合并可用 —— 推之前必须真编一次。
      - name: 编译闸门 —— 合并结果必须能编译
        if: steps.merge.outputs.merged == 'true'
        run: |
          set -euo pipefail
          if go build ./... ; then
            echo "✅ 编译闸门通过：合并结果可以编译"
          else
            echo "::error::自动合并后的代码编译失败，已中止，未推送任何东西。"
            {
              echo "### ❌ 自动合并成功但编译失败，已中止"
              echo
              echo "git 无文本冲突，但合并结果**编译不过** —— 多半是上游与 fork"
              echo "各自新增了同名结构/字段（语义重复），git 察觉不到。"
              echo
              echo "**已知先例**：\`cmd/server/config.go\` 的 \`Config\` 里出现两个 \`Server struct\`"
              echo "（fork 的 \`panel_root\` 与上游的 \`read_timeout\`）→ \`Server redeclared\`。"
              echo
              echo "**在本地解开**："
              echo
              echo '```bash'
              echo "git fetch origin main && git merge origin/main   # 会有\"干净\"但坏的合并"
              echo "go build ./...                                   # 复现失败"
              echo "# 修好后（例如把两个 Server 段合成一个）再提交"
              echo "git push origin main"
              echo '```'
              echo
              echo "推完 build-armv7 会被 push 事件自动触发（用 PAT 推的话）。"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: 推送合并结果
        if: steps.merge.outputs.merged == 'true'
        run: |
          set -euo pipefail
          git push origin "HEAD:${UPSTREAM_BRANCH}"
          echo "已推送 $(git rev-parse --short HEAD) 到 origin/${UPSTREAM_BRANCH}"

      - name: 显式触发 armv7 构建（仅在未使用 PAT 时）
        if: ${{ steps.tok.outputs.pat == 'false' && (steps.merge.outputs.merged == 'true' || github.event.inputs.force_build == 'true') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ⚠️ 必须显式钉死仓库，否则 gh 会去操作**上游**仓库！
          #    原因：gh 用 git remote 推断当前仓库，而它的排序规则是
          #    remoteNameSortScore —— upstream=3 > github=2 > origin=1。
          #    上面的「拉取上游」步骤 `git remote add upstream ...` 恰好加了一个
          #    名叫 upstream 的 remote，于是 gh 优先选中它，把仓库解析成
          #    linguo2625469/workbuddy2api-panel；那个仓库里没有 build-armv7.yml
          #    → `HTTP 404: workflow build-armv7.yml not found on the default branch`
          #    （2026-09-29 / 2026-10-05 两次失败都是这个原因，重试 5 次必然全失败）。
          #    GH_REPO 在 gh 的仓库解析里优先级最高，直接绕过 remote 推断。
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # 刚推送完，GitHub 侧的 ref 可能还没完全可见，重试几次
          for i in 1 2 3 4 5; do
            if gh workflow run build-armv7.yml --ref "${UPSTREAM_BRANCH}"; then
              echo "已触发 build-armv7"
              exit 0
            fi
            echo "触发失败（第 $i 次），5 秒后重试..."
            sleep 5
          done
          echo "::error::无法触发 build-armv7，请到 Actions 页面手动运行"
          exit 1

      - name: 写入摘要
        if: always()
        run: |
          {
            echo "## 上游同步结果"
            echo
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 上游 | \`${UPSTREAM_REPO}\` |"
            echo "| 上游 HEAD | \`${{ steps.fetch.outputs.upstream_sha || '未取到' }}\` |"
            echo "| 落后提交数 | ${{ steps.diff.outputs.behind || 'n/a' }} |"
            echo "| fork 自有提交 | ${{ steps.diff.outputs.ahead || 'n/a' }} |"
            echo "| 本次是否合并 | ${{ steps.merge.outputs.merged == 'true' && '是' || '否（已是最新或冲突）' }} |"
            echo
            if [ "${{ steps.merge.outputs.merged }}" = "true" ]; then
              echo "> fork 自有改动（panel_root / CORS）已通过 merge 保留。"
              echo "> 若上游实现了某项 fork 改动，记得按 \`FORK.md\` 的「改动归还」处理。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
